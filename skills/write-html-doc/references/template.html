<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFCFA;
    --ink:#1C1E22;
    --muted:#71767D;
    --faint:#9AA0A6;
    --rule:#E4E5E1;
    --rule-strong:#CBCDC7;
    --accent:#235E8C;
    --accent-soft:#EBF1F6;
    --code-bg:#F5F5F0;
    --yes:#2F7D45;
    --no:#B0402F;
    --warn:#9A6B1E;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --measure:74ch;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--mono);font-size:15px;font-weight:400;line-height:1.75;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;}
  a:hover{border-bottom-color:var(--accent);}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:1px;}

  .shell{max-width:1240px;margin:0 auto;padding:clamp(1.75rem,4vw,4rem) clamp(1.25rem,4vw,3rem);}
  .layout{display:block;}
  @media (min-width:1000px){
    .layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:clamp(2rem,5vw,4.5rem);align-items:start;}
  }

  /* contents rail */
  .toc{margin:0 0 2.5rem;padding:0 0 1.5rem;border-bottom:1px solid var(--rule);}
  @media (min-width:1000px){
    .toc{position:sticky;top:2rem;margin:0;padding:0;border-bottom:none;max-height:calc(100vh - 4rem);overflow:auto;}
  }
  .toc-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--faint);margin:0 0 1rem;}
  .toc ol{list-style:none;margin:0;padding:0;}
  .toc a{display:block;color:var(--muted);border:none;padding:0.28rem 0 0.28rem 0.85rem;font-size:12.5px;line-height:1.5;border-left:2px solid var(--rule);}
  .toc a:hover{color:var(--ink);border-left-color:var(--rule-strong);}
  .toc a .n{color:var(--faint);margin-right:0.55rem;}
  .toc a.active{color:var(--accent);border-left-color:var(--accent);}
  .toc a.active .n{color:var(--accent);}

  /* header */
  .eyebrow{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin:0 0 1.4rem;}
  h1{font-size:clamp(1.55rem,3.4vw,2.1rem);font-weight:600;line-height:1.2;letter-spacing:-0.015em;margin:0 0 1.2rem;max-width:30ch;}
  .thesis{font-size:clamp(0.98rem,1.6vw,1.08rem);line-height:1.7;color:var(--ink);max-width:var(--measure);margin:0 0 2.2rem;}
  .thesis b{font-weight:600;color:var(--accent);}
  .meta{display:grid;grid-template-columns:max-content 1fr;gap:0.4rem 1.4rem;max-width:var(--measure);font-size:13px;margin:0 0 2.6rem;padding:1.3rem 0;border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);}
  .meta dt{color:var(--faint);text-transform:uppercase;letter-spacing:0.08em;font-size:11px;align-self:center;}
  .meta dd{margin:0;color:var(--ink);}
  .meta .ok{color:var(--accent);}

  /* sections */
  .sec{max-width:var(--measure);margin:3.5rem 0 0;padding:2.5rem 0 0;border-top:1px solid var(--rule);scroll-margin-top:1.5rem;}
  .sec.wide{max-width:none;}
  .sec:first-of-type{border-top:none;padding-top:0;}
  .sec h2{font-size:1.15rem;font-weight:600;letter-spacing:-0.01em;margin:0 0 1.3rem;display:flex;gap:0.85rem;align-items:baseline;}
  .sec h2 .num{color:var(--accent);font-weight:600;flex:none;}
  .sec h3{font-size:0.96rem;font-weight:600;margin:2rem 0 0.8rem;color:var(--ink);}
  .flow > * + *{margin-top:1.05rem;}
  p{margin:0;max-width:var(--measure);}
  .muted{color:var(--muted);}
  .small{font-size:13px;}

  ul.clean{margin:0;padding:0;list-style:none;}
  ul.clean li{position:relative;padding-left:1.5rem;margin:0.55rem 0;}
  ul.clean li::before{content:"—";position:absolute;left:0;color:var(--faint);}
  ul.clean li b{font-weight:600;}
  ul.clean ul.clean{margin-top:0.4rem;}
  ul.clean ul.clean li::before{content:"·";}

  code{background:var(--code-bg);padding:0.08em 0.36em;border-radius:2px;font-size:0.9em;color:var(--ink);}
  .cap{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);margin:0 0 0.7rem;}

  /* diagram */
  .diagram{background:var(--code-bg);border:1px solid var(--rule);border-left:2px solid var(--rule-strong);padding:1.2rem 1.3rem;margin:1.6rem 0;overflow-x:auto;font-size:12.5px;line-height:1.6;color:var(--ink);white-space:pre;}
  .diagram .accent{color:var(--accent);font-weight:600;}
  .diagram .dim{color:var(--faint);}

  /* pillar callout */
  .pillar{border:1px solid var(--rule);border-left:2px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent 55%);padding:1.15rem 1.3rem;margin:1.5rem 0;max-width:var(--measure);}
  .pillar .plabel{font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin:0 0 0.5rem;}
  .pillar p{margin:0;}

  /* tables */
  .tbl-wrap{overflow-x:auto;margin:1.6rem 0;}
  table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.55;}
  th,td{text-align:left;vertical-align:top;padding:0.6rem 1rem 0.6rem 0;border-bottom:1px solid var(--rule);}
  th{color:var(--faint);font-weight:500;text-transform:uppercase;letter-spacing:0.08em;font-size:11px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;}
  tbody tr:hover td{background:var(--code-bg);}
  td b{font-weight:600;}
  td.k{white-space:nowrap;color:var(--accent);}
  /* matrix: compact centered status columns */
  table.matrix td,table.matrix th{padding:0.5rem 0.7rem;}
  table.matrix th.c,table.matrix td.c{text-align:center;}
  table.matrix td.feat{padding-left:0;padding-right:1.1rem;}
  .yes{color:var(--yes);font-weight:600;}
  .no{color:var(--no);font-weight:600;}
  .warn{color:var(--warn);font-weight:600;}
  .na{color:var(--faint);}

  /* classification chips */
  .chip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:0.04em;padding:0.05em 0.45em;border-radius:2px;white-space:nowrap;border:1px solid var(--rule-strong);color:var(--muted);background:var(--code-bg);}
  .chip.ind{color:var(--accent);border-color:#Bcd2e2;background:var(--accent-soft);}
  .chip.dead{color:var(--no);border-color:#e2c4bd;background:#f7ece9;}
  .legend{display:flex;flex-wrap:wrap;gap:0.5rem 1.4rem;font-size:12px;color:var(--muted);margin:1rem 0 0;}
  .legend span b{font-weight:600;}

  .foot{max-width:var(--measure);margin:4rem 0 0;padding:1.6rem 0 0;border-top:1px solid var(--rule-strong);font-size:12px;color:var(--muted);line-height:1.7;}
  .foot code{background:none;padding:0;color:var(--muted);}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}*{transition:none !important;}}
  @media print{body{background:#fff;}.toc{display:none;}.layout{display:block;}.sec,.sec.wide{max-width:none;}tbody tr:hover td{background:none;}}
</style>
</head>
<body>
<div class="shell">
<div class="layout">

  <nav class="toc" aria-label="Contents">
    <p class="toc-label">Contents</p>
    <ol>
      <!-- TOC_ITEMS: one <li><a href="#id"><span class="n">N</span>Short label</a></li> per section, in document order -->
    </ol>
  </nav>

  <main>
    <!-- MAIN_CONTENT: <header> block, then one <section class="sec" id="..."> per section. See components.md. -->
  </main>

</div>
</div>

<script>
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
    var map = {};
    links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
    var sections = Array.prototype.slice.call(document.querySelectorAll('.sec'));
    if (!('IntersectionObserver' in window) || !sections.length) return;
    var current = null;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          if (current) current.classList.remove('active');
          var a = map[e.target.id];
          if (a) { a.classList.add('active'); current = a; }
        }
      });
    }, { rootMargin: '-10% 0px -75% 0px', threshold: 0 });
    sections.forEach(function (s) { io.observe(s); });
  })();
</script>
</body>
</html>
